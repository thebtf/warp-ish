[package]
name = "warp-ish-mcp-adapter"
version = "0.2.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = "=1.0.150"

[target.'cfg(windows)'.dependencies]
tokio = { version = "=1.50.0", features = ["net", "rt", "time"] }
warp_ish_mcp_transport = { path = "../warp_ish_mcp_transport" }

[[bin]]
name = "warp-ish-mcp"
path = "src/main.rs"
