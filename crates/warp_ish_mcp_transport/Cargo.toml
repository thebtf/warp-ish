[package]
name = "warp_ish_mcp_transport"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.50.0", features = ["io-util", "macros", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "=1.50.0", features = ["net"] }
uuid = { version = "=1.19.0", features = ["v4"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }
